<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Pedro César Camargo dos Santos — Back-end Developer, Java e Spring Boot, Consultor de Implantação de ERP">
  <title>Pedro César Camargo dos Santos — Back-end Developer | Java &amp; Spring Boot | ERP Implementation Consultant</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F6F8FA"/>
      <stop offset="100%" stop-color="#EDF1F5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4C8C2B"/>
      <stop offset="55%" stop-color="#1F86A8"/>
      <stop offset="100%" stop-color="#1E6FD9"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4C8C2B" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4C8C2B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1E6FD9" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#475569" stroke-width="0.5" stroke-opacity="0.10"/>
    </pattern>

    <clipPath id="t0"><rect class="type type0" x="411" y="177" width="0" height="30"/></clipPath>
    <clipPath id="t1"><rect class="type type1" x="411" y="177" width="0" height="30"/></clipPath>
    <clipPath id="t2"><rect class="type type2" x="345" y="177" width="0" height="30"/></clipPath>
    <clipPath id="t3"><rect class="type type3" x="309" y="177" width="0" height="30"/></clipPath>
    <clipPath id="t4"><rect class="type type4" x="249" y="177" width="0" height="30"/></clipPath>
  </defs>

  <style>
    .name   { font-family: 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 46px; fill: #0F172A; letter-spacing: -0.4px; }
    .role   { font-family: 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 18px; fill: #1E6FD9; letter-spacing: 0.6px; }
    .sep    { fill: #64748B; }
    .mono   { font-family: ui-monospace, 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, monospace; font-size: 20px; }
    .prompt { fill: #4C8C2B; }
    .line   { fill: #0F172A; }
    .kicker { font-family: ui-monospace, 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, monospace; font-size: 13px; fill: #475569; letter-spacing: 2.4px; }

    @keyframes fade { 0% {opacity:0} 1.5% {opacity:1} 18.5% {opacity:1} 20% {opacity:0} 100% {opacity:0} }
    .phrase { opacity: 0; animation: fade 20s linear infinite; }
    .p0 { animation-delay:  0s; } .p1 { animation-delay: -16s; } .p2 { animation-delay: -12s; }
    .p3 { animation-delay: -8s; } .p4 { animation-delay: -4s; }

    @keyframes ty0 { 0%{width:0} 6%{width:216px} 100%{width:216px} }
    @keyframes ty1 { 0%{width:0} 6%{width:216px} 100%{width:216px} }
    @keyframes ty2 { 0%{width:0} 8%{width:348px} 100%{width:348px} }
    @keyframes ty3 { 0%{width:0} 9%{width:420px} 100%{width:420px} }
    @keyframes ty4 { 0%{width:0} 11%{width:540px} 100%{width:540px} }
    .type  { animation-duration: 20s; animation-timing-function: steps(18, end); animation-iteration-count: infinite; }
    .type0 { animation-name: ty0; animation-delay:  0s; }
    .type1 { animation-name: ty1; animation-delay: -16s; }
    .type2 { animation-name: ty2; animation-delay: -12s; animation-timing-function: steps(29, end); }
    .type3 { animation-name: ty3; animation-delay: -8s;  animation-timing-function: steps(35, end); }
    .type4 { animation-name: ty4; animation-delay: -4s;  animation-timing-function: steps(45, end); }

    @keyframes ca0 { 0%{transform:translateX(0)} 6%{transform:translateX(216px)} 100%{transform:translateX(216px)} }
    @keyframes ca2 { 0%{transform:translateX(0)} 8%{transform:translateX(348px)} 100%{transform:translateX(348px)} }
    @keyframes ca3 { 0%{transform:translateX(0)} 9%{transform:translateX(420px)} 100%{transform:translateX(420px)} }
    @keyframes ca4 { 0%{transform:translateX(0)} 11%{transform:translateX(540px)} 100%{transform:translateX(540px)} }
    @keyframes blink { 0%,45%{opacity:1} 55%,100%{opacity:0.2} }
    .caret { animation-duration: 20s, 1s; animation-timing-function: steps(18,end), steps(1,end); animation-iteration-count: infinite, infinite; }
    .c0 { animation-name: ca0, blink; animation-delay:  0s, 0s; }
    .c1 { animation-name: ca0, blink; animation-delay: -16s, 0s; }
    .c2 { animation-name: ca2, blink; animation-delay: -12s, 0s; animation-timing-function: steps(29,end), steps(1,end); }
    .c3 { animation-name: ca3, blink; animation-delay: -8s,  0s; animation-timing-function: steps(35,end), steps(1,end); }
    .c4 { animation-name: ca4, blink; animation-delay: -4s,  0s; animation-timing-function: steps(45,end), steps(1,end); }

    @media (prefers-reduced-motion: reduce) {
      .phrase, .type, .caret { animation: none; }
      .p0 { opacity: 1; }
      .type0 { width: 216px; }
      .caret { opacity: 0; }
    }
  </style>

  <rect width="1000" height="250" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="250" rx="14" fill="url(#grid)"/>
  <rect x="0" y="0" width="1000" height="4" rx="2" fill="url(#accent)"/>

  <text class="kicker" x="500" y="40" text-anchor="middle">BACK-END ENGINEERING · ERP · CLOUD</text>
  <text class="name"   x="500" y="98" text-anchor="middle">Pedro César Camargo dos Santos</text>
  <text class="role"   x="500" y="132" text-anchor="middle">Back-end Developer <tspan class="sep">·</tspan> Java &amp; Spring Boot <tspan class="sep">·</tspan> ERP Implementation Consultant</text>

  <rect x="410" y="152" width="180" height="2" rx="1" fill="url(#rule)"/>

  <g class="phrase p0">
    <text class="mono prompt" x="373" y="200">~$</text>
    <g clip-path="url(#t0)"><text class="mono line" x="411" y="200">Back-end Developer</text></g>
    <rect class="caret c0" x="411" y="181" width="10" height="25" rx="1" fill="#4C8C2B"/>
  </g>
  <g class="phrase p1">
    <text class="mono prompt" x="373" y="200">~$</text>
    <g clip-path="url(#t1)"><text class="mono line" x="411" y="200">Java &amp; Spring Boot</text></g>
    <rect class="caret c1" x="411" y="181" width="10" height="25" rx="1" fill="#4C8C2B"/>
  </g>
  <g class="phrase p2">
    <text class="mono prompt" x="307" y="200">~$</text>
    <g clip-path="url(#t2)"><text class="mono line" x="345" y="200">ERP Implementation Consultant</text></g>
    <rect class="caret c2" x="345" y="181" width="10" height="25" rx="1" fill="#4C8C2B"/>
  </g>
  <g class="phrase p3">
    <text class="mono prompt" x="271" y="200">~$</text>
    <g clip-path="url(#t3)"><text class="mono line" x="309" y="200">APIs, Cloud &amp; Software Architecture</text></g>
    <rect class="caret c3" x="309" y="181" width="10" height="25" rx="1" fill="#4C8C2B"/>
  </g>
  <g class="phrase p4">
    <text class="mono prompt" x="211" y="200">~$</text>
    <g clip-path="url(#t4)"><text class="mono line" x="249" y="200">Building software for real business problems.</text></g>
    <rect class="caret c4" x="249" y="181" width="10" height="25" rx="1" fill="#4C8C2B"/>
  </g>

  <text class="kicker" x="500" y="232" text-anchor="middle">SOROCABA · SP · BRASIL</text>
</svg>
